[package]
name = "rust-snell"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
lru = "0.12"
bytes = "1"
thiserror = "2"
